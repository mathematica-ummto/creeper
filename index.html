<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Creeper Terminal - 1971</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal-box {
            border: 2px solid #00ff00;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px #00ff00;
            background-color: #050505;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .btn {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            font-family: monospace;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 10px #00ff00;
        }
    </style>
</head>
<body>

    <div class="terminal-box">
        <p>> INITIALIZING HISTORICAL PROTOCOL...</p>
        <h1>I'M THE CREEPER:<br>CATCH ME IF YOU CAN!</h1>
        <p style="font-size: 0.9rem; color: #00aa00;">ARPANET - 1971 : Le tout premier ancêtre des virus.</p>
        <button class="btn" onclick="window.close()">[ FERMER LA FENÊTRE ]</button>
    </div>

</body>
</html>
